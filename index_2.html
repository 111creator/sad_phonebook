<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAD 전화번호부</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --border: #2a2a3a;
      --accent: #7c6af7; --accent2: #f76a8a; --text: #e8e8f0;
      --muted: #6b6b88; --success: #4ade80; --danger: #f87171;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 680px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.5rem; animation: fadeDown 0.6s ease; }
    header h1 { font-family: 'Space Mono', monospace; font-size: 2rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; font-family: 'Space Mono', monospace; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; animation: fadeUp 0.5s ease; }
    .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 1rem; font-family: 'Space Mono', monospace; }
    .form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 140px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    button { cursor: pointer; border: none; border-radius: 10px; padding: 0.75rem 1.25rem; font-family: 'Noto Sans KR', sans-serif; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #9b8cf9); color: #fff; }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); padding: 0.4rem 0.75rem; font-size: 0.8rem; border-radius: 8px; }
    .btn-danger:hover { background: rgba(248,113,113,0.1); border-color: var(--danger); }
    .btn-edit { background: transparent; border: 1px solid var(--border); color: var(--accent); padding: 0.4rem 0.75rem; font-size: 0.8rem; border-radius: 8px; }
    .btn-edit:hover { background: rgba(124,106,247,0.1); border-color: var(--accent); }
    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap input { width: 100%; padding-left: 2.5rem; }
    .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #contact-list { list-style: none; }
    .contact-item { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 0; border-bottom: 1px solid var(--border); gap: 1rem; animation: fadeUp 0.3s ease; }
    .contact-item:last-child { border-bottom: none; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: 500; font-size: 0.95rem; }
    .contact-phone { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .contact-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .empty-state { text-align: center; color: var(--muted); padding: 2rem 0; font-size: 0.9rem; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1.25rem; font-size: 0.85rem; opacity: 0; transition: all 0.3s ease; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .count-badge { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--muted); float: right; }
    .lock-badge { font-size: 0.7rem; background: rgba(124,106,247,0.15); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0.2rem 0.5rem; margin-left: 0.5rem; vertical-align: middle; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 90%; max-width: 400px; animation: fadeUp 0.3s ease; }
    .modal h3 { margin-bottom: 1rem; font-size: 1rem; }
    .modal .form-row { flex-direction: column; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1rem; justify-content: flex-end; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-secondary:hover { background: var(--border); }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>📒 SAD_PHONEBOOK</h1>
    <p>전화번호 관리 시스템 · 암호화 저장 <span style="color:var(--accent)">🔐</span></p>
  </header>

  <div class="card">
    <h2>새 연락처 추가</h2>
    <div class="form-row">
      <input type="text" id="input-name" placeholder="이름" />
      <input type="text" id="input-phone" placeholder="전화번호" />
      <button class="btn-primary" onclick="addContact()">추가</button>
    </div>
  </div>

  <div class="card">
    <h2>
      연락처 목록 <span class="lock-badge">🔐 암호화됨</span>
      <span class="count-badge" id="count-badge">0명</span>
    </h2>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="이름 또는 번호로 검색..." oninput="renderList()" />
    </div>
    <ul id="contact-list">
      <li class="empty-state">불러오는 중...</li>
    </ul>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>✏️ 연락처 수정</h3>
    <div class="form-row">
      <input type="text" id="edit-name" placeholder="이름" />
      <input type="text" id="edit-phone" placeholder="전화번호" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://dharpwxxxnqacmbppmgw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1QZY_RhSmNxgIyADIqzm-w_pT9xTDJY';
  // 암호화 키 (실제 서비스에서는 환경변수로 관리)
  const ENCRYPT_KEY = 'SAD_PHONEBOOK_SECRET_KEY_2026';

  // ── 암호화/복호화 (AES-GCM) ──────────────────────────────
  async function getKey() {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(ENCRYPT_KEY), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode('sad_salt'), iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  async function encrypt(text) {
    const key = await getKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
    const combined = new Uint8Array(iv.byteLength + encrypted.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(encrypted), iv.byteLength);
    return btoa(String.fromCharCode(...combined));
  }

  async function decrypt(b64) {
    try {
      const key = await getKey();
      const combined = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const iv = combined.slice(0, 12);
      const data = combined.slice(12);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(dec);
    } catch { return '(복호화 오류)'; }
  }
  // ─────────────────────────────────────────────────────────

  let contacts = [];
  let editingId = null;

  async function api(method, path, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  }

  async function loadContacts() {
    try {
      const raw = await api('GET', 'contacts?order=created_at.desc');
      contacts = await Promise.all(raw.map(async c => ({
        ...c,
        name: await decrypt(c.name),
        phone_number: await decrypt(c.phone_number),
        _raw: c
      })));
      renderList();
    } catch(e) {
      showToast('불러오기 실패: ' + e.message, 'error');
    }
  }

  function renderList() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = contacts.filter(c =>
      c.name.toLowerCase().includes(q) || c.phone_number.includes(q)
    );
    const list = document.getElementById('contact-list');
    document.getElementById('count-badge').textContent = `${contacts.length}명`;
    if (filtered.length === 0) {
      list.innerHTML = `<li class="empty-state">${q ? '검색 결과가 없습니다' : '연락처가 없습니다'}</li>`;
      return;
    }
    list.innerHTML = filtered.map(c => `
      <li class="contact-item">
        <div class="contact-info">
          <div class="contact-name">${escHtml(c.name)}</div>
          <div class="contact-phone">${escHtml(c.phone_number)}</div>
        </div>
        <div class="contact-actions">
          <button class="btn-edit" onclick="openEdit(${c.id})">수정</button>
          <button class="btn-danger" onclick="deleteContact(${c.id})">삭제</button>
        </div>
      </li>
    `).join('');
  }

  async function addContact() {
    const name = document.getElementById('input-name').value.trim();
    const phone = document.getElementById('input-phone').value.trim();
    if (!name || !phone) { showToast('이름과 전화번호를 입력해주세요', 'error'); return; }
    try {
      const encName = await encrypt(name);
      const encPhone = await encrypt(phone);
      const [created] = await api('POST', 'contacts', { name: encName, phone_number: encPhone });
      contacts.unshift({ ...created, name, phone_number: phone });
      renderList();
      document.getElementById('input-name').value = '';
      document.getElementById('input-phone').value = '';
      showToast('연락처가 추가되었습니다 🔐', 'success');
    } catch(e) {
      showToast('추가 실패: ' + e.message, 'error');
    }
  }

  async function deleteContact(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    try {
      await api('DELETE', `contacts?id=eq.${id}`);
      contacts = contacts.filter(c => c.id !== id);
      renderList();
      showToast('삭제되었습니다', 'success');
    } catch(e) {
      showToast('삭제 실패: ' + e.message, 'error');
    }
  }

  function openEdit(id) {
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    document.getElementById('edit-name').value = c.name;
    document.getElementById('edit-phone').value = c.phone_number;
    document.getElementById('edit-modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('active');
    editingId = null;
  }

  async function saveEdit() {
    const name = document.getElementById('edit-name').value.trim();
    const phone = document.getElementById('edit-phone').value.trim();
    if (!name || !phone) { showToast('이름과 전화번호를 입력해주세요', 'error'); return; }
    try {
      const encName = await encrypt(name);
      const encPhone = await encrypt(phone);
      await api('PATCH', `contacts?id=eq.${editingId}`, { name: encName, phone_number: encPhone });
      const idx = contacts.findIndex(c => c.id === editingId);
      if (idx !== -1) { contacts[idx].name = name; contacts[idx].phone_number = phone; }
      renderList();
      closeModal();
      showToast('수정되었습니다 🔐', 'success');
    } catch(e) {
      showToast('수정 실패: ' + e.message, 'error');
    }
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('input-phone').addEventListener('keydown', e => {
    if (e.key === 'Enter') addContact();
  });

  loadContacts();
</script>
</body>
</html>
